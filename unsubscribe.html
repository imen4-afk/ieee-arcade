<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>Unsubscribe – IEEE ISIMA Student Branch</title>
  <link rel="icon" href="assets/img/sb-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <a class="back-btn" href="index.html">← Arcade</a>
    <span class="sb-logo">
      <img class="logo-img" src="assets/img/sb-logo-white.png" alt="IEEE ISIMA Student Branch logo"
           onerror="this.hidden = true; this.nextElementSibling.hidden = false;">
      <span class="logo-fallback" hidden>IEEE ISIMA SB</span>
    </span>
    <h1 class="topbar-title">Unsubscribe</h1>
  </header>

  <main class="container">
    <section class="card">
      <h2>Stop event reminders</h2>
      <p>Enter the email you subscribed with. We'll stop sending you reminders about IEEE ISIMA SB events.</p>
      <form id="unsub-form" novalidate>
        <label for="unsub-email">Your email</label>
        <input id="unsub-email" type="email" autocomplete="email" inputmode="email" maxlength="254"
               placeholder="you@example.com" autocapitalize="off" spellcheck="false">
        <p class="subscribe-msg" id="unsub-msg" role="status" aria-live="polite" hidden></p>
        <button type="submit" class="btn btn-primary btn-block" id="unsub-btn">Unsubscribe</button>
      </form>
    </section>
    <p class="center small"><a href="events.html">← Back to upcoming events</a></p>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/layout.js" data-root=""></script>
  <script src="js/subscribe.js"></script>
  <script>
    (function () {
      "use strict";
      var form = document.getElementById("unsub-form");
      var input = document.getElementById("unsub-email");
      var msg = document.getElementById("unsub-msg");
      var btn = document.getElementById("unsub-btn");

      function show(text, ok) {
        msg.textContent = text;
        msg.className = "subscribe-msg " + (ok ? "ok" : "error");
        msg.hidden = false;
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (!window.IEEESubscribe.isValidEmail(input.value)) { show("Please enter a valid email address.", false); return; }
        btn.disabled = true;
        window.IEEESubscribe.unsubscribe(input.value).then(function (r) {
          btn.disabled = false;
          // Same message whether or not the email was on the list (nobody can test addresses).
          if (r.ok) { show("You won't receive reminders anymore.", true); input.value = ""; }
          else show(r.error, false);
        });
      });
    })();
  </script>
</body>
</html>

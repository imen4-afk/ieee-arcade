<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- IEEE Arcade: based on javascript-tetris by Jake Gordon (MIT, see LICENSE).
       Changes are marked "IEEE Arcade:". The game logic is the original one. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>Tetris – IEEE Arcade</title>
  <link rel="icon" href="../../assets/img/sb-icon.png">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/game-kit.css">
  <style>
    /* IEEE Arcade: mobile-first portrait layout (replaces the original fixed-size media queries).
       --cell = size of one block: fits the phone width AND the screen height. */
    #tetris   { --cell: min(5.4vw, calc((100vh - 330px) / 20), 30px);
                display: flex; justify-content: center; align-items: flex-start; gap: 10px; margin: 0 auto; }
    #canvas   { display: block; width: calc(var(--cell) * 10); height: calc(var(--cell) * 20);
                border-radius: 8px; border: 2px solid #2e2e2e;
                background-color: #071a2e;                       /* IEEE Arcade: circuit-line background instead of texture.jpg */
                background-image: radial-gradient(circle at 12px 12px, rgba(0,181,226,0.22) 1.5px, transparent 2px),
                                  linear-gradient(90deg, rgba(0,181,226,0.08) 1px, transparent 1px),
                                  linear-gradient(rgba(0,181,226,0.08) 1px, transparent 1px);
                background-size: 48px 48px, 24px 24px, 24px 24px;
                box-shadow: var(--shadow); touch-action: none; }
    #menu     { display: flex; flex-direction: column; gap: 10px; width: calc(var(--cell) * 5 + 8px); min-width: 84px; }
    #menu p   { margin: 0; text-align: center; }
    #upcoming { display: block; width: calc(var(--cell) * 5); height: calc(var(--cell) * 5); min-width: 76px; min-height: 76px;
                margin: 0 auto; border-radius: 8px; background-color: #071a2e; border: 2px solid #2e2e2e; }
    .tt-stat  { padding: 6px 4px; border-radius: var(--radius-sm); background: var(--card-2); }
    .tt-stat span { display: block; font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    #score, #rows { display: block; font-size: 1.3rem; font-weight: 900; font-variant-numeric: tabular-nums; }
    #score    { color: var(--orange); }
    #rows     { color: var(--link); }

    /* IEEE Arcade: big touch buttons under the board */
    .tt-pad   { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 420px; margin: 12px auto 0; }
    .tt-btn   { min-height: 58px; border: 0; border-radius: var(--radius-sm); background: var(--card-2); color: var(--text);
                font-size: 1.5rem; font-weight: 900; cursor: pointer; touch-action: none; -webkit-user-select: none; user-select: none; }
    .tt-btn:active, .tt-btn.held { background: var(--ieee-blue); color: #fff; }
    #tt-rotate { background: var(--grad-orange); color: var(--on-orange); }
    .tt-keys  { margin-top: 6px; }
  </style>
</head>

<body>
  <!-- IEEE Arcade: shared header -->
  <header class="topbar">
    <a class="back-btn" href="../../index.html">← Arcade</a>
    <span class="sb-logo">
      <img class="logo-img" src="../../assets/img/sb-logo-white.png" alt="IEEE ISIMA Student Branch logo"
           onerror="this.hidden = true; this.nextElementSibling.hidden = false;">
      <span class="logo-fallback" hidden>IEEE ISIMA SB</span>
    </span>
    <h1 class="topbar-title">Tetris</h1>
  </header>
  <div class="gk-subbar" id="gk-subbar"></div>

  <main class="game-main">
    <section class="card gk-screen" id="gk-start" hidden></section>

    <div id="gk-play" hidden>
      <div id="tetris">
        <canvas id="canvas">
          Sorry, this example cannot be run because your browser does not support the &lt;canvas&gt; element
        </canvas>
        <div id="menu">
          <p class="tt-stat"><span>Next</span></p>
          <p><canvas id="upcoming"></canvas></p>
          <p class="tt-stat"><span>Score</span><b id="score">00000</b></p>
          <p class="tt-stat"><span>Lines</span><b id="rows">0</b></p>
        </div>
      </div>
      <!-- IEEE Arcade: touch controls (hold ◀ ▶ ▼ to repeat) -->
      <div class="tt-pad" role="group" aria-label="Controls">
        <button type="button" class="tt-btn" id="tt-left" aria-label="Move left">◀</button>
        <button type="button" class="tt-btn" id="tt-rotate" aria-label="Rotate">⟳</button>
        <button type="button" class="tt-btn" id="tt-right" aria-label="Move right">▶</button>
        <button type="button" class="tt-btn" id="tt-down" aria-label="Soft drop">▼</button>
        <button type="button" class="tt-btn" id="tt-hard" aria-label="Hard drop">⤓</button>
      </div>
      <p class="small center tt-keys">Keyboard: ← → move · ↑ rotate · ↓ soft drop · Space hard drop</p>
    </div>

    <section class="card gk-screen" id="gk-end" hidden></section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="../../js/config.js"></script>
  <script src="../../js/activities.js"></script>
  <script src="../../js/arcade.js"></script>
  <script src="../../js/layout.js" data-root="../../"></script>
  <script src="../../js/game-kit.js"></script>
  <script>

    //-------------------------------------------------------------------------
    // base helper methods
    //-------------------------------------------------------------------------

    function get(id)        { return document.getElementById(id);  }
    function hide(id)       { get(id).style.visibility = 'hidden'; }
    function show(id)       { get(id).style.visibility = null;     }
    function html(id, html) { get(id).textContent = html;          } // IEEE Arcade: textContent instead of innerHTML

    function timestamp()           { return new Date().getTime();                             }
    function random(min, max)      { return (min + (Math.random() * (max - min)));            }
    function randomChoice(choices) { return choices[Math.round(random(0, choices.length-1))]; }

    //-------------------------------------------------------------------------
    // game constants
    //-------------------------------------------------------------------------

    var KEY     = { ESC: 27, SPACE: 32, LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40 },
        DIR     = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3, MIN: 0, MAX: 3 },
        HARD    = 'hard',  // IEEE Arcade: new action, hard drop
        canvas  = get('canvas'),
        ctx     = canvas.getContext('2d'),
        ucanvas = get('upcoming'),
        uctx    = ucanvas.getContext('2d'),
        speed   = { start: 0.6, decrement: 0.005, min: 0.1 }, // how long before piece drops by 1 row (seconds)
        nx      = 10, // width of tetris court (in blocks)
        ny      = 20, // height of tetris court (in blocks)
        nu      = 5;  // width/height of upcoming preview (in blocks)
    // IEEE Arcade: the stats.js FPS counter was removed.

    //-------------------------------------------------------------------------
    // game variables (initialized during reset)
    //-------------------------------------------------------------------------

    var dx, dy,        // pixel size of a single tetris block
        blocks,        // 2 dimensional array (nx*ny) representing tetris court - either empty block or occupied by a 'piece'
        actions,       // queue of user actions (inputs)
        playing,       // true|false - game is in progress
        dt,            // time since starting this game
        current,       // the current piece
        next,          // the next piece
        score,         // the current score
        vscore,        // the currently displayed score (it catches up to score in small chunks - like a spinning slot machine)
        rows,          // number of completed rows in the current game
        step;          // how long before current piece drops by 1 row

    //-------------------------------------------------------------------------
    // tetris pieces (IEEE Arcade: colors = IEEE blue, light blue, CS orange, white, gray)
    //-------------------------------------------------------------------------

    var i = { size: 4, blocks: [0x0F00, 0x2222, 0x00F0, 0x4444], color: '#00B5E2' };  // light blue
    var j = { size: 3, blocks: [0x44C0, 0x8E00, 0x6440, 0x0E20], color: '#3080ff' };  // bright blue
    var l = { size: 3, blocks: [0x4460, 0x0E80, 0xC440, 0x2E00], color: '#F99C00' };  // CS orange
    var o = { size: 2, blocks: [0xCC00, 0xCC00, 0xCC00, 0xCC00], color: '#FFD08A' };  // light orange
    var s = { size: 3, blocks: [0x06C0, 0x8C40, 0x6C00, 0x4620], color: '#FFFFFF' };  // white
    var t = { size: 3, blocks: [0x0E40, 0x4C40, 0x4E00, 0x4640], color: '#A1A1A1' };  // gray
    var z = { size: 3, blocks: [0x0C60, 0x4C80, 0xC600, 0x2640], color: '#00629B' };  // IEEE blue

    //------------------------------------------------
    // do the bit manipulation and iterate through each
    // occupied block (x,y) for a given piece
    //------------------------------------------------
    function eachblock(type, x, y, dir, fn) {
      var bit, result, row = 0, col = 0, blocks = type.blocks[dir];
      for(bit = 0x8000 ; bit > 0 ; bit = bit >> 1) {
        if (blocks & bit) {
          fn(x + col, y + row);
        }
        if (++col === 4) {
          col = 0;
          ++row;
        }
      }
    }

    //-----------------------------------------------------
    // check if a piece can fit into a position in the grid
    //-----------------------------------------------------
    function occupied(type, x, y, dir) {
      var result = false
      eachblock(type, x, y, dir, function(x, y) {
        if ((x < 0) || (x >= nx) || (y < 0) || (y >= ny) || getBlock(x,y))
          result = true;
      });
      return result;
    }

    function unoccupied(type, x, y, dir) {
      return !occupied(type, x, y, dir);
    }

    //-----------------------------------------
    // start with 4 instances of each piece and
    // pick randomly until the 'bag is empty'
    //-----------------------------------------
    var pieces = [];
    function randomPiece() {
      if (pieces.length == 0)
        pieces = [i,i,i,i,j,j,j,j,l,l,l,l,o,o,o,o,s,s,s,s,t,t,t,t,z,z,z,z];
      var type = pieces.splice(random(0, pieces.length-1), 1)[0];
      return { type: type, dir: DIR.UP, x: Math.round(random(0, nx - type.size)), y: 0 };
    }


    //-------------------------------------------------------------------------
    // GAME LOOP
    //-------------------------------------------------------------------------

    function run() {

      addEvents(); // attach keydown and resize events

      var last = now = timestamp();
      // IEEE Arcade: don't count the time spent in another tab
      document.addEventListener('visibilitychange', function() { last = timestamp(); });
      function frame() {
        now = timestamp();
        update(Math.min(0.1, (now - last) / 1000.0)); // IEEE Arcade: max step 0.1 s (was 1 s)
        draw();
        last = now;
        requestAnimationFrame(frame, canvas);
      }

      resize(); // setup all our sizing information
      reset();  // reset the per-game variables
      frame();  // start the first frame

    }

    function addEvents() {
      document.addEventListener('keydown', keydown, false);
      window.addEventListener('resize', resize, false);
    }

    function resize(event) {
      // IEEE Arcade: sharp on high-density phones (canvas pixels = CSS size × devicePixelRatio)
      var dpr = Math.min(window.devicePixelRatio || 1, 3);
      canvas.width   = Math.round(canvas.clientWidth * dpr);
      canvas.height  = Math.round(canvas.clientHeight * dpr);
      ucanvas.width  = Math.round(ucanvas.clientWidth * dpr);
      ucanvas.height = Math.round(ucanvas.clientHeight * dpr);
      dx = canvas.width  / nx; // pixel size of a single tetris block
      dy = canvas.height / ny; // (ditto)
      invalidate();
      invalidateNext();
    }

    function keydown(ev) {
      var handled = false;
      if (playing) {
        switch(ev.keyCode) {
          case KEY.LEFT:   actions.push(DIR.LEFT);  handled = true; break;
          case KEY.RIGHT:  actions.push(DIR.RIGHT); handled = true; break;
          case KEY.UP:     actions.push(DIR.UP);    handled = true; break;
          case KEY.DOWN:   actions.push(DIR.DOWN);  handled = true; break;
          case KEY.SPACE:  actions.push(HARD);      handled = true; break; // IEEE Arcade: Space = hard drop
          case KEY.ESC:    lose();                  handled = true; break;
        }
      }
      // IEEE Arcade: "Space to play" removed: games start with the arcade's Play button.
      if (handled)
        ev.preventDefault(); // prevent arrow keys from scrolling the page (supported in IE9+ and all other browsers)
    }

    //-------------------------------------------------------------------------
    // GAME LOGIC
    //-------------------------------------------------------------------------

    function play() { reset(); playing = true; } // IEEE Arcade: no "start" link to hide any more
    function lose() {
      setVisualScore(); playing = false;
      // IEEE Arcade: send the arcade points and show the end screen
      if (window.IEEETetris) window.IEEETetris.onGameOver(score, rows);
    }

    function setVisualScore(n)      { vscore = n || score; invalidateScore(); }
    function setScore(n)            { score = n; setVisualScore(n);  }
    function addScore(n)            { score = score + n;   }
    function clearScore()           { setScore(0); }
    function clearRows()            { setRows(0); }
    function setRows(n)             { rows = n; step = Math.max(speed.min, speed.start - (speed.decrement*rows)); invalidateRows(); }
    function addRows(n)             { setRows(rows + n); }
    function getBlock(x,y)          { return (blocks && blocks[x] ? blocks[x][y] : null); }
    function setBlock(x,y,type)     { blocks[x] = blocks[x] || []; blocks[x][y] = type; invalidate(); }
    function clearBlocks()          { blocks = []; invalidate(); }
    function clearActions()         { actions = []; }
    function setCurrentPiece(piece) { current = piece || randomPiece(); invalidate();     }
    function setNextPiece(piece)    { next    = piece || randomPiece(); invalidateNext(); }

    function reset() {
      dt = 0;
      clearActions();
      clearBlocks();
      clearRows();
      clearScore();
      setCurrentPiece(next);
      setNextPiece();
    }

    function update(idt) {
      if (playing) {
        if (vscore < score)
          setVisualScore(vscore + 1);
        handle(actions.shift());
        dt = dt + idt;
        if (dt > step) {
          dt = dt - step;
          drop();
        }
      }
    }

    function handle(action) {
      switch(action) {
        case DIR.LEFT:  move(DIR.LEFT);  break;
        case DIR.RIGHT: move(DIR.RIGHT); break;
        case DIR.UP:    rotate();        break;
        case DIR.DOWN:  drop();          break;
        case HARD:      hardDrop();      break; // IEEE Arcade
      }
    }

    function move(dir) {
      var x = current.x, y = current.y;
      switch(dir) {
        case DIR.RIGHT: x = x + 1; break;
        case DIR.LEFT:  x = x - 1; break;
        case DIR.DOWN:  y = y + 1; break;
      }
      if (unoccupied(current.type, x, y, current.dir)) {
        current.x = x;
        current.y = y;
        invalidate();
        return true;
      }
      else {
        return false;
      }
    }

    function rotate() {
      var newdir = (current.dir == DIR.MAX ? DIR.MIN : current.dir + 1);
      if (unoccupied(current.type, current.x, current.y, newdir)) {
        current.dir = newdir;
        invalidate();
      }
    }

    function drop() {
      if (!move(DIR.DOWN)) {
        addScore(10);
        dropPiece();
        removeLines();
        setCurrentPiece(next);
        setNextPiece(randomPiece());
        clearActions();
        if (occupied(current.type, current.x, current.y, current.dir)) {
          lose();
        }
      }
    }

    // IEEE Arcade: hard drop = move down as far as possible, then lock the piece (same scoring as before)
    function hardDrop() {
      while (move(DIR.DOWN)) { /* keep falling */ }
      drop();
    }

    function dropPiece() {
      eachblock(current.type, current.x, current.y, current.dir, function(x, y) {
        setBlock(x, y, current.type);
      });
    }

    function removeLines() {
      var x, y, complete, n = 0;
      for(y = ny ; y > 0 ; --y) {
        complete = true;
        for(x = 0 ; x < nx ; ++x) {
          if (!getBlock(x, y))
            complete = false;
        }
        if (complete) {
          removeLine(y);
          y = y + 1; // recheck same line
          n++;
        }
      }
      if (n > 0) {
        addRows(n);
        addScore(100*Math.pow(2,n-1)); // 1: 100, 2: 200, 3: 400, 4: 800
      }
    }

    function removeLine(n) {
      var x, y;
      for(y = n ; y >= 0 ; --y) {
        for(x = 0 ; x < nx ; ++x)
          setBlock(x, y, (y == 0) ? null : getBlock(x, y-1));
      }
    }

    //-------------------------------------------------------------------------
    // RENDERING
    //-------------------------------------------------------------------------

    var invalid = {};

    function invalidate()         { invalid.court  = true; }
    function invalidateNext()     { invalid.next   = true; }
    function invalidateScore()    { invalid.score  = true; }
    function invalidateRows()     { invalid.rows   = true; }

    function draw() {
      ctx.save();
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.55)'; // IEEE Arcade: softer block outlines on the dark board
      ctx.translate(0.5, 0.5); // for crisp 1px black lines
      drawCourt();
      drawNext();
      drawScore();
      drawRows();
      ctx.restore();
    }

    function drawCourt() {
      if (invalid.court) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (playing)
          drawPiece(ctx, current.type, current.x, current.y, current.dir);
        var x, y, block;
        for(y = 0 ; y < ny ; y++) {
          for (x = 0 ; x < nx ; x++) {
            if (block = getBlock(x,y))
              drawBlock(ctx, x, y, block.color);
          }
        }
        invalid.court = false; // IEEE Arcade: the court border is drawn in CSS
      }
    }

    function drawNext() {
      if (invalid.next) {
        var padding = (nu - next.type.size) / 2; // half-arsed attempt at centering next piece display
        // IEEE Arcade: the preview uses its own block size (it's a separate canvas)
        var pdx = ucanvas.width / nu, pdy = ucanvas.height / nu;
        uctx.save();
        uctx.translate(0.5, 0.5);
        uctx.clearRect(0, 0, ucanvas.width, ucanvas.height);
        uctx.strokeStyle = 'rgba(0, 0, 0, 0.55)';
        eachblock(next.type, padding, padding, next.dir, function(x, y) {
          uctx.fillStyle = next.type.color;
          uctx.fillRect(x*pdx, y*pdy, pdx, pdy);
          uctx.strokeRect(x*pdx, y*pdy, pdx, pdy);
        });
        uctx.restore();
        invalid.next = false;
      }
    }

    function drawScore() {
      if (invalid.score) {
        html('score', ("00000" + Math.floor(vscore)).slice(-5));
        invalid.score = false;
      }
    }

    function drawRows() {
      if (invalid.rows) {
        html('rows', rows);
        invalid.rows = false;
      }
    }

    function drawPiece(ctx, type, x, y, dir) {
      eachblock(type, x, y, dir, function(x, y) {
        drawBlock(ctx, x, y, type.color);
      });
    }

    function drawBlock(ctx, x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x*dx, y*dy, dx, dy);
      ctx.strokeRect(x*dx, y*dy, dx, dy)
    }

    //-------------------------------------------------------------------------
    // IEEE Arcade: touch buttons (hold ◀ ▶ ▼ to repeat), start/end screens
    //-------------------------------------------------------------------------

    (function () {
      var REPEAT_DELAY = 220, REPEAT_EVERY = 75; // ms
      function bind(id, action, repeat) {
        var button = get(id), delay = null, timer = null;
        function stop() {
          clearTimeout(delay); clearInterval(timer); delay = timer = null;
          button.classList.remove('held');
        }
        button.addEventListener('pointerdown', function (e) {
          e.preventDefault();
          if (!playing) return;
          actions.push(action);
          if (!repeat) return;
          button.classList.add('held');
          delay = setTimeout(function () {
            timer = setInterval(function () { if (playing) actions.push(action); else stop(); }, REPEAT_EVERY);
          }, REPEAT_DELAY);
        });
        ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { button.addEventListener(ev, stop); });
        button.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      }
      bind('tt-left', DIR.LEFT, true);
      bind('tt-right', DIR.RIGHT, true);
      bind('tt-down', DIR.DOWN, true);
      bind('tt-rotate', DIR.UP, false);
      bind('tt-hard', HARD, false);
      // no scrolling / zooming while touching the board or the buttons
      ['canvas', 'upcoming'].forEach(function (id) { get(id).addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false }); });
    })();

    var started = false;
    window.IEEETetris = {
      onGameOver: function (finalScore, lines) {
        setTimeout(function () {
          GameKit.finish({
            title: finalScore >= 3000 ? "Line-clearing legend! 🧱" : "Game over!",
            score: "Tetris score: " + finalScore + " · " + lines + " line" + (lines === 1 ? "" : "s"),
            points: GameKit.formulas.tetris(finalScore)
          });
        }, 700);
      }
    };

    GameKit.init({
      id: "game-tetris",
      instructions: "Use the buttons under the board: ◀ ▶ move, ⟳ rotate, ▼ soft drop, ⤓ hard drop. Clear full lines!",
      onStart: function () {
        if (!started) { started = true; run(); }  // the loop starts once…
        resize();
        play();                                   // …and each "Play" starts a new game
        window.scrollTo(0, 0);
      }
    });

    // read-only view of the game state (used by automated tests)
    window.TetrisState = function () { return { playing: playing, score: score, rows: rows, piece: current && { x: current.x, y: current.y, dir: current.dir, size: current.type.size } }; };

  </script>

</body>
</html>

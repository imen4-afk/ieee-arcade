<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>Whack-a-Bug – IEEE Arcade</title>
  <link rel="icon" href="../../assets/img/sb-icon.png">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/game-kit.css">
  <link rel="stylesheet" href="whack.css">
</head>
<body>

  <header class="topbar">
    <a class="back-btn" href="../../index.html">← Arcade</a>
    <span class="sb-logo">
      <img class="logo-img" src="../../assets/img/sb-logo-white.png" alt="IEEE ISIMA Student Branch logo"
           onerror="this.hidden = true; this.nextElementSibling.hidden = false;">
      <span class="logo-fallback" hidden>IEEE ISIMA SB</span>
    </span>
    <h1 class="topbar-title">Whack-a-Bug</h1>
  </header>
  <div class="gk-subbar" id="gk-subbar"></div>

  <main class="game-main">
    <section class="card gk-screen" id="gk-start" hidden></section>

    <div id="gk-play" hidden>
      <div class="gk-hud">
        <span>Score: <span id="wb-score">0</span></span>
        <span id="wb-combo" class="wb-combo" aria-live="polite"></span>
        <span>⏱ <span id="wb-time">30</span>s</span>
      </div>
      <div class="gk-timer" aria-hidden="true"><div class="gk-timer-fill" id="wb-timer"></div></div>
      <div class="wb-board gk-touch" id="wb-board" aria-label="Board: tap the bugs"></div>
      <p class="small center wb-legend">🐛 +10 · 🪲 golden +30 · ✅ feature −15</p>
    </div>

    <section class="card gk-screen" id="gk-end" hidden></section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="../../js/config.js"></script>
  <script src="../../js/activities.js"></script>
  <script src="../../js/arcade.js"></script>
  <script src="../../js/layout.js" data-root="../../"></script>
  <script src="../../js/game-kit.js"></script>
  <script src="whack.js"></script>
</body>
</html>

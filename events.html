<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>Upcoming events – IEEE ISIMA Student Branch</title>
  <link rel="icon" href="assets/img/sb-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <a class="back-btn" href="index.html">← Arcade</a>
    <span class="sb-logo">
      <img class="logo-img" src="assets/img/sb-logo-white.png" alt="IEEE ISIMA Student Branch logo"
           onerror="this.hidden = true; this.nextElementSibling.hidden = false;">
      <span class="logo-fallback" hidden>IEEE ISIMA SB</span>
    </span>
    <h1 class="topbar-title">Events</h1>
    <span class="player-chip" data-player-chip></span>
  </header>

  <main class="container" id="events-page">
    <h2 class="section-title" id="month-title">Upcoming events</h2>
    <p class="section-lead"><span class="tag">📅 This month</span></p>

    <p class="small" id="events-status" aria-live="polite">Loading events…</p>
    <div class="event-list" id="events-month"></div>

    <div class="card empty-events" id="events-empty" hidden>
      <div class="ezzdin-says">
        <img src="assets/img/mascot.png" alt="Ezzdin, the IEEE ISIMA SB mascot" width="56" height="56" onerror="this.hidden = true;">
        <p>No events scheduled yet this month. Check back soon! <strong>— Ezzdin</strong></p>
      </div>
    </div>

    <section id="later-section" hidden aria-labelledby="later-title">
      <h2 class="section-title" id="later-title">Coming later</h2>
      <div class="event-list compact" id="events-later"></div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/arcade.js"></script>
  <script src="js/layout.js" data-root=""></script>
  <!-- events come from data/events.json (no database) -->
  <script src="js/events-format.js"></script>
  <script src="js/events.js"></script>
  <script src="js/events-page.js"></script>
</body>
</html>
